// Public, pure render API qualification only. No game fixture or store dependency.
allprojects { project ->
    project.plugins.withId('com.android.application') {
        project.android {
            testBuildType = 'release'
            defaultConfig {
                testApplicationId 'com.androidhit.lumadrift.arttest.v117'
                testInstrumentationRunner 'com.androidhit.lumadrift.qa.v117art.ArtInstrumentation'
            }
            sourceSets {
                androidTest {
                    java.srcDirs = [new File(rootDir, 'scripts/v117-art-test/java')]
                    assets.srcDirs = [new File(rootDir, 'scripts/v117-art-test/assets')]
                    manifest.srcFile new File(rootDir, 'scripts/v117-art-test/AndroidManifest.xml')
                }
            }
        }
        project.tasks.matching { it.name == 'packageProductionReleaseAndroidTest' }.configureEach {
            doLast {
                copy {
                    from project.layout.buildDirectory.file('outputs/apk/androidTest/production/release/app-production-release-androidTest.apk')
                    into project.layout.buildDirectory.dir('qualification-artifacts/v1.17')
                    rename { 'art-production-test.apk' }
                }
            }
        }
    }
}
