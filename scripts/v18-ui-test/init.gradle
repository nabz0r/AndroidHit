// Test-only SDK framework runner. No application source or dependency is changed.
// AGP uses the tested release variant's existing signing configuration.
allprojects { project ->
    project.plugins.withId('com.android.application') {
        project.android {
            testBuildType = 'release'
            defaultConfig { testInstrumentationRunner (project.findProperty('lumaUiTarget') == 'production' ? 'com.androidhit.lumadrift.qa.ProductionStartupInstrumentation' : 'com.androidhit.lumadrift.qa.CandidateUiInstrumentation') }
            sourceSets {
                androidTest {
                    java.srcDirs = [new File(rootDir, 'scripts/v18-ui-test/java')]
                    assets.srcDirs = [new File(rootDir, 'scripts/v18-ui-test/assets')]
                    manifest.srcFile new File(rootDir, 'scripts/v18-ui-test/AndroidManifest.xml')
                }
            }
        }
    }
}
