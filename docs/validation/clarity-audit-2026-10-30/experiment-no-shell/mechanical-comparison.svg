<text x="55" y="565" class="head" >Sondes sans aide : 9 423 / 12 000 → 8 474 / 12 000 (78,53 % → 70,62 %).</text>
<text x="55" y="590" class="small" >Les coques sont aussi retirées des sondes : cette baisse ne mesure pas un effet isolé sur l’apprentissage.</text>
