allprojects { project ->
    project.plugins.withId('com.android.application') {
        project.android {
            testBuildType = 'release'
            defaultConfig { testInstrumentationRunner 'com.androidhit.lumadrift.qa.commerce112.CommerceInstrumentation' }
            sourceSets {
                androidTest {
                    java.srcDirs = [new File(rootDir, 'scripts/v112-commerce-ui/java')]
                    assets.srcDirs = []
                    manifest.srcFile new File(rootDir, 'scripts/v112-commerce-ui/AndroidManifest.xml')
                }
            }
        }
    }
}
