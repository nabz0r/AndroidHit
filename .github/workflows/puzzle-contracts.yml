            /scripts/test-data.sh
            /scripts/DataTest.java
            /scripts/test-collection-events.sh
            /scripts/CollectionEventsTest.java
            /scripts/test-home-v115.sh
            /scripts/test-home-v115-geometry.sh
            /scripts/HomeV115Test.java
            /scripts/HomeV115GeometryTest.java
            /scripts/test-home-v116-geometry.sh
            /scripts/HomeV116GeometryTest.java
            /scripts/test-profile-summon-v116.sh
            /scripts/ProfileSummonV116Test.java
            /scripts/home-render-support/
            /scripts/test-learning-v114.sh
            /scripts/test-deliberate-play-v114.sh
            /scripts/test-learning-guide.sh
            /scripts/test-power-offers-v114.sh
            /scripts/LearningV114Test.java
            /scripts/DeliberatePlayV114Test.java
            /scripts/LearningGuideTest.java
            /scripts/PowerOffersV114Test.java
            /scripts/RewardsCosmeticsV17Test.java
            /scripts/test-expedition-v118-model.sh
            /scripts/test-expedition-v118-store.sh
            /scripts/test-companion-motion-v118.sh
            /scripts/ExpeditionV118ModelTest.java
            /scripts/ExpeditionV118StoreTest.java
            /scripts/CompanionMotionV118Test.java
            /scripts/test-companion-battle-v119.sh
            /scripts/CompanionBattleV119Test.java
            /scripts/test-companion-action-v119.sh
            /scripts/CompanionBattleActionV119Test.java
            /scripts/test-squad-store-v119.sh
            /scripts/SquadV119StoreTest.java
            /scripts/test-companion-battle-v119-geometry.sh
            /scripts/CompanionBattleV119GeometryTest.java
            /scripts/test-adventure-v119-geometry.sh
            /scripts/AdventureV119GeometryTest.java
            /scripts/AuditJourneyV114.java
            /scripts/ProgressionAnalysis.java
