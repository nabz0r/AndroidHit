            /scripts/test-support/android/content/*.java
            /scripts/test-support/android/graphics/*.java
            /docs/validation/v1.14/audit-learning-rc1/LearningLayouts.java
            /docs/validation/v1.6/legacy-content-before.sha256

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache-jdk: false
          overwrite-settings: false

      - name: Qualify all 1000 N boards and their pacing
        run: sh scripts/test-learning-v114.sh "$RUNNER_TEMP/luma-puzzle-contracts/learning"

      - name: Qualify all 1000 U boards and every reachable relay state
        run: sh scripts/test-relay-v115.sh "$RUNNER_TEMP/luma-puzzle-contracts/relay"

      - name: Preserve historical codes, six sealed challenges and original budgets
        run: |
          sh scripts/test-engine.sh
          bash scripts/test-sealed.sh
          sh scripts/test-progression-v3.sh "$RUNNER_TEMP/luma-puzzle-contracts/progression-v3"
          bash scripts/test-move-budget.sh

      - name: Qualify every L and M state and the finite daily and weekly geometry pool
        run: sh scripts/test-strategy-v4.sh "$RUNNER_TEMP/luma-puzzle-contracts/strategy"

      - name: Qualify every Guardian state and once-only reward transactions
        run: |
          bash scripts/test-guardian-v19.sh "$RUNNER_TEMP/luma-puzzle-contracts/guardians"
          bash scripts/test-guardian-store-v19.sh "$RUNNER_TEMP/luma-puzzle-contracts/guardian-store"

      - name: Check daily, weekly and Remix transactions and calendar boundaries
        run: |
          bash scripts/test-data.sh
          bash scripts/test-collection-events.sh
          bash scripts/test-economy.sh
          bash scripts/test-meta.sh

      - name: Check three-room ownership, migration and camera geometry
        run: |
          bash scripts/test-home-v115.sh
          bash scripts/test-home-v115-geometry.sh

      - name: Check strict budgets, the saved Return and legacy continuations
        run: sh scripts/test-deliberate-play-v114.sh

      - name: Check adaptive home camera and recoverable player collection
        run: |
          bash scripts/test-home-v116-geometry.sh
          bash scripts/test-profile-summon-v116.sh "$RUNNER_TEMP/luma-puzzle-contracts/profile-summon.json"

      - name: Check contextual rules and six-language feedback
        run: sh scripts/test-learning-guide.sh

      - name: Check 1.17 scene transitions and original sprite geometry
        run: |
          bash scripts/test-scene-transition-v117.sh
          bash scripts/test-root-scenes-v117.sh
          bash scripts/test-art-v117-geometry.sh

      - name: Check 50 synthesized arrangements, earcons and audio lifecycle model
        run: bash scripts/test-audio-scenes-v117.sh "$RUNNER_TEMP/luma-puzzle-contracts/audio-scenes-v117"

      - name: Check puzzle gates, budgets, feedback and compact action reachability
        run: bash scripts/test-play-scene-v117-geometry.sh

      - name: Check 1.20 interactions and retained website language and media controls
        # Uses the runner's Node test runtime; no package install, SDK, network,
        # browser, Firebase deployment or native gameplay claim is involved.
        run: node --test scripts/test-site-v121-runtime.mjs scripts/test-simulation-v121.mjs scripts/test-site-v120-runtime.mjs scripts/test-site-v119.mjs scripts/test-site-v118.mjs scripts/test-site-v117.mjs scripts/test-site-v116.mjs

      - name: Check 1.22 homepage structure and local demo syntax
        # Bounded structure-only check accepts the pending or final page without
        # APKs, native captures, provider access or a deployment claim.
        run: |
          python3 scripts/check-site-v122.py --structure-only
          node --check public/assets/site-v122.js
          node --check public/lab/ui-1-22/simulation.mjs
          node --test scripts/test-site-v122-runtime.mjs
          python3 scripts/test-deploy-site-v122.py
          python3 scripts/test-stage-site-v122-rest.py

      - name: Check exact APK delta transport and refused artifact replacement
        # Small generated ZIP fixtures only; no APK download or SDK is needed.
        run: python3 scripts/test-apk-byte-delta.py

      - name: Check 1.18 expeditions, copies, durable costume choice and motion contracts
        # Pure Java only. Native H APKs/captures remain separate frozen release evidence.
        run: |
          bash scripts/test-expedition-v118-model.sh "$RUNNER_TEMP/luma-puzzle-contracts/expedition-model.json"
          bash scripts/test-expedition-v118-store.sh "$RUNNER_TEMP/luma-puzzle-contracts/expedition-store.json"
          bash scripts/test-companion-motion-v118.sh "$RUNNER_TEMP/luma-puzzle-contracts/companion-motion.json"

      - name: Check 1.19 team ownership, durable skills, U-board effects and adventure/dock geometry
        # Pure host contracts only. They neither log in nor call ads/payments;
        # actual Android gestures and rendered acceptance remain separate evidence.
        run: |
          bash scripts/test-companion-battle-v119.sh
          bash scripts/test-companion-action-v119.sh "$RUNNER_TEMP/luma-puzzle-contracts/companion-action-v119"
          bash scripts/test-squad-store-v119.sh
          bash scripts/test-companion-battle-v119-geometry.sh
          bash scripts/test-adventure-v119-geometry.sh

      - name: Check 1.20 session pacing and genuine avatar reactions
        run: |
          bash scripts/test-focused-journey-v120.sh "$RUNNER_TEMP/luma-puzzle-contracts/focused-journey-v120.json"
          bash scripts/test-session-energy-v120.sh
          bash scripts/test-menu-v120.sh

      - name: Check 1.21 elemental preparation, direct-exit Focus and confirmed-balance animation
        run: |
          bash scripts/test-elemental-shell-v121.sh "$RUNNER_TEMP/luma-puzzle-contracts/elemental-shells-v121.json"
          bash scripts/test-arcade-presentation-v121.sh "$RUNNER_TEMP/luma-puzzle-contracts/arcade-presentation-v121.json"

      - name: Check 1.21 menus, four independent rooms and chapter map
        run: |
          bash scripts/test-menu-v121.sh
          bash scripts/test-home-kitchen-v121.sh "$RUNNER_TEMP/luma-puzzle-contracts/home-kitchen-v121.json"
          sh scripts/test-saga-map-v17.sh

      - name: Check 1.21 logarithmic entitlements, earned-Coin Undo receipts and energy capacity
        run: |
          bash scripts/test-economy-curve-v121.sh "$RUNNER_TEMP/luma-puzzle-contracts/economy-curve-v121.json"
          bash scripts/test-session-energy-v121.sh "$RUNNER_TEMP/luma-puzzle-contracts/session-energy-v121.json"
          bash scripts/simulate-summon-economy-v121.sh "$RUNNER_TEMP/luma-puzzle-contracts/summon-economy-v121"

      - name: Check 1.22 map navigation and durable tactical chapters
        # Pure Java contracts; Android UI recordings remain separate evidence.
        run: |
          bash scripts/test-journey-world-v122.sh
          bash scripts/test-tactical-chapter-v122.sh
          bash scripts/test-tactical-session-v122.sh

      - name: Check transactional premium refill outbox with a pinned JSON parser
        run: |
          curl --fail --location --retry 2 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar --output "$RUNNER_TEMP/json-20240303.jar"
          printf '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  %s\n' "$RUNNER_TEMP/json-20240303.jar" | sha256sum --check
          LUMA_JSON_JAR="$RUNNER_TEMP/json-20240303.jar" bash scripts/test-energy-purchase-v120.sh
          LUMA_JSON_JAR="$RUNNER_TEMP/json-20240303.jar" bash scripts/test-wallet-energy-transport-v120.sh

      - name: Check power offers and preserved reward decisions
        run: sh scripts/test-power-offers-v114.sh "$RUNNER_TEMP/luma-puzzle-contracts/power-offers.json"

  packaged-companion-art:
    name: Packaged 1.18 art and frozen rig revision
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: sh
    steps:
      - name: Check out only shipped art and its recorded rig baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/puzzle-contracts.yml
            /app/src/main/java/com/androidhit/lumadrift/data/Catalog.java
            /app/src/main/assets/art/v118/*.json
            /app/src/main/assets/art/v118/*.webp
            /scripts/v118-art/audit-assets.py
            /scripts/v118-art/test-source-clip.py
            /scripts/v118-art/test-packaged-audit.py
            /scripts/v118-art/requirements-ci.txt
            /docs/art/v118/assets-manifest.json
            /docs/validation/v1.18/rig-g-all-proposals/applied.json
            /docs/validation/v1.18/rig-g-all-proposals/before/*.json

      - name: Prepare the pinned image inspection runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/luma-v118-art-venv"
          "$RUNNER_TEMP/luma-v118-art-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: -r scripts/v118-art/requirements-ci.txt

      - name: Check polygon boundaries and refused asset revisions
        run: |
          "$RUNNER_TEMP/luma-v118-art-venv/bin/python" scripts/v118-art/test-source-clip.py
          "$RUNNER_TEMP/luma-v118-art-venv/bin/python" scripts/v118-art/test-packaged-audit.py

      - name: Inspect all 148 shipped sheets and verify their committed asset tree
        # Requires neither original generation PNGs nor temporary proposals, APKs,
        # Android tools, native screenshots or signing keys. Does not repeat the
        # historical PNG/WebP equivalence proof or claim anatomical clothing fit.
        run: |
          "$RUNNER_TEMP/luma-v118-art-venv/bin/python" scripts/v118-art/audit-assets.py --packaged-only --rig-revision-receipt docs/validation/v1.18/rig-g-all-proposals/applied.json --output "$RUNNER_TEMP/luma-v118-art/art-integrity.json" --asset-manifest "$RUNNER_TEMP/luma-v118-art/assets-manifest.json" --workers 2
          cmp docs/art/v118/assets-manifest.json "$RUNNER_TEMP/luma-v118-art/assets-manifest.json"
