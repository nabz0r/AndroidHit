name: Puzzle contracts

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puzzle-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-puzzle-contracts:
    name: Offline puzzle contracts (Java 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: sh
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          # Sparse checkout automatically fetches blob:none in this pinned action.
          # Do not also set filter: it overrides the documented sparse option.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.gitignore
            /.github/workflows/puzzle-contracts.yml
            /app/src/main/java/com/androidhit/lumadrift/engine/*.java
            /app/src/main/java/com/androidhit/lumadrift/data/*.java
            /app/src/main/java/com/androidhit/lumadrift/onboarding/*.java
            /app/src/main/java/com/androidhit/lumadrift/progression/LearningGuide.java
            /app/src/main/java/com/androidhit/lumadrift/progression/LearningStrings.java
            /app/src/main/java/com/androidhit/lumadrift/ui/HomeScene.java
            /app/src/main/java/com/androidhit/lumadrift/ui/SceneTransition.java
            /app/src/main/java/com/androidhit/lumadrift/ui/SceneRootLayout.java
            /app/src/main/java/com/androidhit/lumadrift/ui/PlaySceneLayout.java
            /app/src/main/java/com/androidhit/lumadrift/ui/SpriteGeometry.java
            /app/src/main/java/com/androidhit/lumadrift/audio/*.java
            /scripts/test-scene-transition-v117.sh
            /scripts/SceneTransitionV117Test.java
            /scripts/test-root-scenes-v117.sh
            /scripts/RootSceneV117GeometryTest.java
            /scripts/test-play-scene-v117-geometry.sh
            /scripts/PlaySceneV117GeometryTest.java
            /scripts/test-art-v117-geometry.sh
            /scripts/SpriteV117GeometryTest.java
            /scripts/test-audio-scenes-v117.sh
            /scripts/AudioSceneV117Test.java
            /scripts/test-support/audio/
            /scripts/test-site-v117.mjs
            /scripts/test-site-v116.mjs
            /public/assets/site.js
            /docs/validation/site-v1.17/index.template.html
            /docs/validation/v1.7/audio/audio-biome-metrics.csv
            /docs/validation/v1.7/audio/legacy-pcm.sha256
            /scripts/test-relay-v115.sh
            /scripts/RelayV115Test.java
            /scripts/test-engine.sh
            /scripts/EngineTest.java
            /scripts/test-sealed.sh
            /scripts/SealedTest.java
            /scripts/test-progression-v3.sh
            /scripts/ProgressionV3Test.java
            /scripts/GenerateProgressionV3.java
            /scripts/LegacyContentFingerprint.java
            /scripts/test-move-budget.sh
            /scripts/MoveBudgetTest.java
            /scripts/test-strategy-v4.sh
            /scripts/StrategyV4Audit.java
            /scripts/StrategyV4ContractTest.java
            /scripts/test-guardian-v19.sh
            /scripts/GuardianV19Test.java
            /scripts/test-guardian-store-v19.sh
            /scripts/GuardianStoreV19Test.java
            /scripts/test-data.sh
            /scripts/DataTest.java
            /scripts/test-collection-events.sh
            /scripts/CollectionEventsTest.java
            /scripts/test-home-v115.sh
            /scripts/test-home-v115-geometry.sh
            /scripts/HomeV115Test.java
            /scripts/HomeV115GeometryTest.java
            /scripts/test-home-v116-geometry.sh
            /scripts/HomeV116GeometryTest.java
            /scripts/test-profile-summon-v116.sh
            /scripts/ProfileSummonV116Test.java
            /scripts/home-render-support/
            /scripts/test-learning-v114.sh
            /scripts/test-deliberate-play-v114.sh
            /scripts/test-learning-guide.sh
            /scripts/test-power-offers-v114.sh
            /scripts/LearningV114Test.java
            /scripts/DeliberatePlayV114Test.java
            /scripts/LearningGuideTest.java
            /scripts/PowerOffersV114Test.java
            /scripts/RewardsCosmeticsV17Test.java
            /scripts/AuditJourneyV114.java
            /scripts/ProgressionAnalysis.java
            /scripts/test-support/android/annotation/*.java
            /scripts/test-support/android/content/*.java
            /scripts/test-support/android/graphics/*.java
            /docs/validation/v1.14/audit-learning-rc1/LearningLayouts.java
            /docs/validation/v1.6/legacy-content-before.sha256

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache-jdk: false
          overwrite-settings: false

      - name: Qualify all 1000 N boards and their pacing
        run: sh scripts/test-learning-v114.sh "$RUNNER_TEMP/luma-puzzle-contracts/learning"

      - name: Qualify all 1000 U boards and every reachable relay state
        run: sh scripts/test-relay-v115.sh "$RUNNER_TEMP/luma-puzzle-contracts/relay"

      - name: Preserve historical codes, six sealed challenges and original budgets
        run: |
          sh scripts/test-engine.sh
          bash scripts/test-sealed.sh
          sh scripts/test-progression-v3.sh "$RUNNER_TEMP/luma-puzzle-contracts/progression-v3"
          bash scripts/test-move-budget.sh

      - name: Qualify every L and M state and the finite daily and weekly geometry pool
        run: sh scripts/test-strategy-v4.sh "$RUNNER_TEMP/luma-puzzle-contracts/strategy"

      - name: Qualify every Guardian state and once-only reward transactions
        run: |
          bash scripts/test-guardian-v19.sh "$RUNNER_TEMP/luma-puzzle-contracts/guardians"
          bash scripts/test-guardian-store-v19.sh "$RUNNER_TEMP/luma-puzzle-contracts/guardian-store"

      - name: Check daily, weekly and Remix transactions and calendar boundaries
        run: |
          bash scripts/test-data.sh
          bash scripts/test-collection-events.sh

      - name: Check three-room ownership, migration and camera geometry
        run: |
          bash scripts/test-home-v115.sh
          bash scripts/test-home-v115-geometry.sh

      - name: Check strict budgets, the saved Return and legacy continuations
        run: sh scripts/test-deliberate-play-v114.sh

      - name: Check adaptive home camera and recoverable player collection
        run: |
          bash scripts/test-home-v116-geometry.sh
          bash scripts/test-profile-summon-v116.sh "$RUNNER_TEMP/luma-puzzle-contracts/profile-summon.json"

      - name: Check contextual rules and six-language feedback
        run: sh scripts/test-learning-guide.sh

      - name: Check 1.17 scene transitions and original sprite geometry
        run: |
          bash scripts/test-scene-transition-v117.sh
          bash scripts/test-root-scenes-v117.sh
          bash scripts/test-art-v117-geometry.sh

      - name: Check 50 synthesized arrangements, earcons and audio lifecycle model
        run: bash scripts/test-audio-scenes-v117.sh "$RUNNER_TEMP/luma-puzzle-contracts/audio-scenes-v117"

      - name: Check puzzle gates, budgets, feedback and compact action reachability
        run: bash scripts/test-play-scene-v117-geometry.sh

      - name: Check 1.17 and retained website language and deliberate audio controls
        # Uses the runner's Node test runtime; no package install, SDK, network,
        # browser, Firebase deployment or native gameplay claim is involved.
        run: node --test scripts/test-site-v117.mjs scripts/test-site-v116.mjs

      - name: Check power offers and preserved reward decisions
        run: sh scripts/test-power-offers-v114.sh "$RUNNER_TEMP/luma-puzzle-contracts/power-offers.json"
