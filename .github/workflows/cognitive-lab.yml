name: Cognitive Lab contracts

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cognitive-lab:
    name: Local model, paired experiments and report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out bounded study inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /scripts/cognitive_lab/
            /scripts/run-cognitive-lab.sh
            /scripts/test-cognitive-lab.sh
            /scripts/deploy-cognitive-overlay.py
            /scripts/test-deploy-cognitive-overlay.py
            /scripts/test-support/android/
            /app/src/main/java/com/androidhit/lumadrift/engine/
            /app/src/main/java/com/androidhit/lumadrift/data/
            /app/src/main/java/com/androidhit/lumadrift/onboarding/
            /app/src/main/java/com/androidhit/lumadrift/LumaView.java
            /public/lab/cognitive/
            /docs/validation/cognitive-lab/latest/
      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache-jdk: false
          overwrite-settings: false
      - name: Validate decisions, native rules, pairing and reproducibility
        run: bash scripts/test-cognitive-lab.sh
      - name: Validate bilingual report and imported data
        run: node --test public/lab/cognitive/tests/*.test.mjs
      - name: Validate additive deployment and refusal boundaries without network
        run: python3 scripts/test-deploy-cognitive-overlay.py
