name: Cognitive Lab contracts

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cognitive-lab:
    name: Local model, paired experiments and report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out bounded study inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /scripts/cognitive_lab/
            /scripts/run-cognitive-lab.sh
            /scripts/test-cognitive-lab.sh
            /scripts/run-cognitive-lab-v122.sh
            /scripts/test-cognitive-lab-v122.sh
            /scripts/verify-cognitive-lab-v122.py
            /scripts/run-cognitive-lab-v123.sh
            /scripts/test-cognitive-lab-v123.sh
            /scripts/verify-cognitive-lab-v123.py
            /scripts/test-cognitive-report-v123.mjs
            /scripts/deploy-cognitive-overlay.py
            /scripts/test-deploy-cognitive-overlay.py
            /scripts/test-support/android/
            /app/src/main/java/com/androidhit/lumadrift/engine/
            /app/src/main/java/com/androidhit/lumadrift/data/
            /app/src/main/java/com/androidhit/lumadrift/onboarding/
            /app/src/main/java/com/androidhit/lumadrift/LumaView.java
            /public/lab/cognitive/
            /public/lab/clarity-123/
            /docs/validation/cognitive-lab/latest/
            /docs/validation/cognitive-lab-v122/latest/
            /docs/validation/cognitive-lab-v123/latest/
      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache-jdk: false
          overwrite-settings: false
      - name: Validate preserved 1.21 and 1.22 factories, historical contracts and report archives
        run: bash scripts/test-cognitive-lab-v122.sh
      - name: Verify historical 1.22 data and exact denominators without requiring current 1.22 sources
        run: python3 scripts/verify-cognitive-lab-v122.py
      - name: Validate 1.23 factory, final-action exhaustion regression and deterministic common-environment probes
        run: bash scripts/test-cognitive-lab-v123.sh
      - name: Verify complete 1.23 data, exact source hashes and no zero-budget horizon censoring
        run: python3 scripts/verify-cognitive-lab-v123.py --require-current-source
      - name: Exercise exact 1.23 report snapshot, French and English conditions and common probe denominators
        run: node --test scripts/test-cognitive-report-v123.mjs
      - name: Validate additive deployment and refusal boundaries without network
        run: python3 scripts/test-deploy-cognitive-overlay.py
